<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Live Cam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #12355b 0%, #1f6f8b 100%);
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            color: #fff;
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .note {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            padding: 16px 20px;
            color: #fff;
            background: #0d6efd;
            font-size: 1.2rem;
        }

        .card:nth-child(2) h2 {
            background: #dc3545;
        }

        iframe {
            width: 100%;
            height: 520px;
            border: 0;
            background: #000;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #f4f7fb;
            border-bottom: 1px solid #dfe7f1;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            background: #0d6efd;
            color: #fff;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .footer {
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        @media (max-width: 960px) {
            .grid {
                grid-template-columns: 1fr;
            }

            iframe {
                height: 420px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monitoring Live Cam</h1>
        </div>

        <div class="note">
            Versi ini adalah HTML murni tanpa backend/proxy. Cocok untuk dibuka langsung dari file lokal atau hosting HTTP biasa. Jika di-host pada HTTPS, browser biasanya memblokir iframe kamera HTTP ini.
        </div>

        <div class="grid">
            <div class="card">
                <h2>Cam 1</h2>
                <div class="controls">
                    <button class="btn" onclick="reloadCam('cam1')">Reload Cam 1</button>
                </div>
                <iframe
                    id="cam1"
                    src="about:blank"
                    allowfullscreen
                    allow="autoplay"
                    referrerpolicy="no-referrer">
                </iframe>
            </div>

            <div class="card">
                <h2>Cam 2</h2>
                <div class="controls">
                    <button class="btn" onclick="reloadCam('cam2')">Reload Cam 2</button>
                </div>
                <iframe
                    id="cam2"
                    src="about:blank"
                    allowfullscreen
                    allow="autoplay"
                    referrerpolicy="no-referrer">
                </iframe>
            </div>
        </div>

        <div class="footer">
            Last updated: <span id="timestamp"></span>
        </div>
    </div>

    <script>
        const camUrls = {
            cam1: 'http://103.245.39.218:8080/808gps/open/player/video.html?lang=en&devIdno=290320207005&account=PWS&password=PWS1234&channel=1&chns=0&isWxApp=1',
            cam2: 'http://103.245.39.218:8080/808gps/open/player/video.html?lang=en&devIdno=290320207005&account=PWS&password=PWS1234&channel=1&chns=1&isWxApp=1'
        };

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = now.toLocaleString('id-ID', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZone: 'Asia/Jakarta'
            });
        }

        function initCamFrames() {
            const cam1 = document.getElementById('cam1');
            const cam2 = document.getElementById('cam2');

            if (cam1) cam1.src = camUrls.cam1;
            if (cam2) cam2.src = camUrls.cam2;
        }

        function reloadCam(id) {
            const frame = document.getElementById(id);
            if (!frame || !camUrls[id]) return;

            frame.src = 'about:blank';
            setTimeout(() => {
                frame.src = camUrls[id];
            }, 200);
        }

        updateTimestamp();
        setInterval(updateTimestamp, 1000);
        initCamFrames();
    </script>
</body>
</html>
