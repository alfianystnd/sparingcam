<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Live Cam - Sparing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .cameras-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .camera-box {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .camera-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .camera-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
        }

        .camera-title.cam2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .camera-stream {
            width: 100%;
            height: 500px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .camera-stream iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .camera-controls {
            display: flex;
            gap: 10px;
            padding: 12px 15px;
            background: #f6f8fc;
            border-top: 1px solid #e6eaf2;
            border-bottom: 1px solid #e6eaf2;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .btn-reload {
            background: #0b5ed7;
            color: #fff;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.95em;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 40px;
            font-size: 0.9em;
        }

        @media (max-width: 1024px) {
            .cameras-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .camera-stream {
                height: 400px;
            }
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #4caf50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Monitoring Live Cam</h1>
        </div>

        <div class="info-box">
            ✓ Sistem monitoring aktif dan terhubung ke server
        </div>

        <div class="cameras-grid">
            <!-- Camera 1 -->
            <div class="camera-box">
                <div class="camera-title">Kamera 1 (Channel 1)</div>
                <div class="camera-controls">
                    <button class="btn btn-reload" data-cam-id="cam1">Reload Kamera 1</button>
                </div>
                <div class="camera-stream">
                    <iframe id="cam1" src="/808gps/open/player/video.html?lang=en&devIdno=290320207005&account=PWS&password=PWS1234&channel=1&chns=0" 
                            allowfullscreen 
                            allow="autoplay"
                            referrerpolicy="no-referrer">
                    </iframe>
                </div>
                <div class="status-bar">
                    <span class="status-indicator"></span>
                    <span>Status: LIVE</span>
                </div>
            </div>

            <!-- Camera 2 -->
            <div class="camera-box">
                <div class="camera-title cam2">Kamera 2 (Channel 2)</div>
                <div class="camera-controls">
                    <button class="btn btn-reload" data-cam-id="cam2">Reload Kamera 2</button>
                </div>
                <div class="camera-stream">
                    <iframe id="cam2" src="/808gps/open/player/video.html?lang=en&devIdno=290320207005&account=PWS&password=PWS1234&channel=1&chns=1" 
                            allowfullscreen 
                            allow="autoplay"
                            referrerpolicy="no-referrer">
                    </iframe>
                </div>
                <div class="status-bar">
                    <span class="status-indicator"></span>
                    <span>Status: LIVE</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Sparing Cam Monitoring System • Last Updated: <span id="timestamp"></span></p>
        </div>
    </div>

    <script src="./livecam.js"></script>
</body>
</html>
